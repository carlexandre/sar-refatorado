# Example only: supply the real name, certificate paths and operator subnet before enabling.
server {
    listen 443 ssl;
    server_name sar.example.org;
    ssl_certificate /etc/sar/tls/fullchain.pem;
    ssl_certificate_key /etc/sar/tls/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Replace by the operator VPN subnet. Default intentionally blocks all remote users.
    allow 127.0.0.1;
    deny all;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600;
    }
}
