[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-reports"
version = "1.0.0"
description = "Sistema de Automatização de Relatórios"
requires-python = ">=3.12,<3.15"
dependencies = ["streamlit", "fpdf2", "pandas", "matplotlib", "pyzabbix", "requests", "argon2-cffi>=25.1,<26"]

[project.scripts]
sar = "sar.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sar = ["resources/**/*", "migrations/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
